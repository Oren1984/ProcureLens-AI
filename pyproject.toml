[project]
name = "procurelens"
version = "1.0.0"
description = "Procurement exception management for ERPNext (portfolio POC/MVP)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Oren Salami" }]
dependencies = [
    "streamlit>=1.50,<2",
    "sqlalchemy>=2.0.40,<2.1",
    "alembic>=1.16,<2",
    "psycopg[binary]>=3.2,<4",
    "pgvector>=0.4,<0.5",
    "argon2-cffi>=25.1,<26",
    "httpx>=0.28,<0.29",
    "fastembed>=0.7,<0.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4",
    "ruff>=0.13",
    "pip-audit>=2.9",
    "playwright>=1.55",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# assert is the pytest idiom; tests use synthetic, non-secret literal passwords.
"tests/**" = ["S101", "S105", "S106"]
# Dev/verification scripts call `docker compose` with constant argument lists.
"scripts/**" = ["S101", "S603", "S607"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "db: requires the PostgreSQL/pgvector test database (TEST_DATABASE_URL)",
    "model: requires the local embedding model (downloaded on first use)",
]
