name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install --no-deps --require-hashes -r requirements-dev.lock
      - run: ruff check src tests scripts migrations
      - run: ruff format --check src tests scripts migrations

  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg17
        env:
          POSTGRES_USER: pl_owner
          POSTGRES_PASSWORD: ci-only-not-secret
          POSTGRES_DB: procurelens_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pl_owner -d procurelens_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://pl_owner:ci-only-not-secret@localhost:5432/procurelens_test
      EMBEDDING_CACHE_DIR: ${{ github.workspace }}/.model-cache
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install --no-deps --require-hashes -r requirements-dev.lock
      - name: Cache embedding model (BAAI/bge-small-en-v1.5 via fastembed)
        uses: actions/cache@v4
        with:
          path: .model-cache
          key: fastembed-bge-small-en-v1.5-0.7.4
      - name: Unit, PostgreSQL/pgvector integration and retrieval-eval tests
        run: python -m pytest -q -rs

  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Dependency audit (locked runtime and dev dependencies)
        run: |
          pip install pip-audit==2.10.1
          pip-audit -r requirements.lock --require-hashes --disable-pip
          pip-audit -r requirements-dev.lock --require-hashes --disable-pip
      - name: Secret scan (repository and history)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t procurelens-app:ci .
      - name: Image vulnerability scan (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: procurelens-app:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          scanners: vuln,secret

  terraform:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: infra/terraform/aws
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.4
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
